server {
    listen 8080;
    server_name _;
    root /var/www/html;

    # Fly runs all Compose services inside one Machine network namespace.
    # Runtime apps therefore use distinct loopback ports instead of DNS names.
    absolute_redirect off;
    client_max_body_size 1G;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    gzip on;
    gzip_types text/plain text/css application/javascript application/wasm image/svg+xml;
    gzip_min_length 256;

    error_page 403 404 502 503 504 /app-unavailable.html;
    location = /app-unavailable.html {
        alias /usr/share/nginx/html/app-unavailable.html;
        internal;
    }

    location = / {
        return 301 /homepage/;
    }

    location ~ ^/(homepage|taboo|unit-converter|yaml-formatter|bingo-creator|ocr|emoji-identifier|exiftools|ghissue2md|graphviz-visualizer|link-extractor|qr|render-markdown|json-utils|matter|tfps|anki-converter|md-converter|contact-sheet-creator|xteink-wallpaper-converter|film-format-converter|kilo-credit-calculator)$ {
        return 301 $uri/;
    }

    location ^~ /_next/ {
        if ($http_referer ~* "/homepage/") {
            root /var/www/html/homepage;
        }
        if ($http_referer ~* "/taboo/") {
            root /var/www/html/taboo;
        }
        if ($http_referer ~* "/unit-converter/") {
            root /var/www/html/unit-converter;
        }
        if ($http_referer ~* "/yaml-formatter/") {
            root /var/www/html/yaml-formatter;
        }
        if ($http_referer ~* "/json-utils/") {
            root /var/www/html/json-utils;
        }
        if ($http_referer ~* "/matter/") {
            root /var/www/html/matter;
        }
        if ($http_referer ~* "/tfps/") {
            root /var/www/html/tfps;
        }
        if ($http_referer ~* "/film-format-converter/") {
            root /var/www/html/film-format-converter;
        }
        if ($http_referer ~* "/kilo-credit-calculator/") {
            root /var/www/html/kilo-credit-calculator;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(homepage|taboo|unit-converter|yaml-formatter|bingo-creator|ocr|emoji-identifier|exiftools|ghissue2md|graphviz-visualizer|link-extractor|qr|render-markdown|json-utils|matter|tfps|anki-converter|md-converter|contact-sheet-creator|xteink-wallpaper-converter|film-format-converter|kilo-credit-calculator)/ {
        try_files $uri $uri/ =404;
        error_page 403 404 502 503 504 /app-unavailable.html;
    }

    location = /tfgr {
        return 301 /tfgr/;
    }

    location ^~ /tfgr/ {
        rewrite ^/tfgr/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        error_page 403 404 413 502 503 504 /app-unavailable.html;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    location ~* \.wasm$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "application/wasm";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
