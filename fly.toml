app = "toozej-tools"
primary_region = "sjc"
kill_signal = "SIGQUIT"
kill_timeout = "30s"
swap_size_mb = 2048

[build]
  dockerfile = "nginx/Dockerfile.fly"
  ignorefile = "nginx/Dockerfile.fly.dockerignore"

[build.compose]
  file = "docker-compose-fly.yml"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/homepage/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
