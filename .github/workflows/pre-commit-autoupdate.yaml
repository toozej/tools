---
name: pre-commit autoupdate

on:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install pre-commit
        run: uv tool install pre-commit --with pre-commit-uv --force-reinstall

      - name: Run pre-commit autoupdate
        run: pre-commit autoupdate

      - name: Create PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: "chore(pre-commit): autoupdate"
          title: "chore(pre-commit): autoupdate"
          body: "Automated `pre-commit autoupdate`."
          branch: "chore/pre-commit-autoupdate"
          labels: dependencies
