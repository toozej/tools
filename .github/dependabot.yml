version: 2
multi-ecosystem-groups:
  combined:
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
updates:
  - package-ecosystem: uv
    directory: /
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - uv
    patterns:
      - '*'
    multi-ecosystem-group: combined
  - package-ecosystem: gomod
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - go
    patterns:
      - '*'
    directories:
      - "apps/*/"
    multi-ecosystem-group: combined
  - package-ecosystem: npm
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - npm
    patterns:
      - '*'
    directories:
      - "apps/*/"
    groups:
      development-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "typescript"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    multi-ecosystem-group: combined
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github-actions
    patterns:
      - '*'
    multi-ecosystem-group: combined
  - package-ecosystem: docker
    directories:
      - "apps/*/"
      - "templates/"
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker
    patterns:
      - '*'
    multi-ecosystem-group: combined
  - package-ecosystem: docker-compose
    directories:
      - "/"
      - "templates/"
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker-compose
    patterns:
      - '*'
    multi-ecosystem-group: combined
  - package-ecosystem: devcontainers
    directory: /
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - devcontainers
    patterns:
      - '*'
    multi-ecosystem-group: combined
  - package-ecosystem: pre-commit
    directory: /
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - pre-commit
    patterns:
      - '*'
    multi-ecosystem-group: combined
